<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七夕 · 心里话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#f5f0e8;font-family:sans-serif;min-height:100vh}
.page{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.page.active{display:flex}
.btn{background:none;border:none;color:#f5f0e8;font-size:1.1em;padding:10px 18px;cursor:pointer;margin:5px}
.btn-primary{color:#d66a5a;border-bottom:2px solid #d66a5a}
.barrage-track{position:absolute;left:0;width:100%;height:33%;overflow:hidden;display:flex;align-items:center}
#track1{top:0}#track2{top:33%}#track3{top:66%}
.barrage-item{position:absolute;white-space:nowrap;animation:move linear infinite}
@keyframes move{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.letter-paper{background:#f5f0e8;color:#333;padding:20px;width:90%;max-width:500px;border-radius:4px}
.letter-paper input,.letter-paper textarea{width:100%;background:none;border:none;font-size:1.1em;padding:8px 0}
.letter-paper textarea{min-height:150px;resize:none}
.wish-item{padding:8px;margin:5px 0;background:rgba(255,255,255,.05);border-radius:4px;cursor:pointer}
.puzzle-board{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:300px;margin:0 auto}
.puzzle-slot{aspect-ratio:1;background:#1e1e2e;border:1px dashed #444}
.piece-pool{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.piece-pool img{width:70px;height:70px;object-fit:cover;cursor:grab}
.mic-btn{width:80px;height:80px;border-radius:50%;border:2px solid #d66a5a;background:none;color:#d66a5a;font-size:30px;margin:20px auto}
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;display:none;z-index:999}
</style>
</head>
  <body>

<!-- 开场页 -->
<div class="page active" id="page-intro">
  <div>有些话，平时说不出口。</div>
  <div style="margin-top:10px;">今天，可以对我说吗？</div>
  <div style="margin-top:20px;">
    <button class="btn" onclick="showPage('letter-choice')">写点什么</button>
    <button class="btn" onclick="showPage('home');initBarrage()">先逛逛</button>
  </div>
</div>

<!-- 弹幕墙 -->
<div class="page" id="page-home">
  <div class="barrage-track" id="track1"></div>
  <div class="barrage-track" id="track2"></div>
  <div class="barrage-track" id="track3"></div>
  <button class="btn btn-primary" style="position:absolute;bottom:30px;left:20px;" onclick="addBarrage()">✎ 我也想说一句</button>
  <nav style="position:absolute;right:10px;top:50%;writing-mode:vertical-rl;display:flex;gap:15px;font-size:14px;color:#888">
    <a onclick="showPage('letter-choice')">情书</a>
    <a onclick="showPage('wish-entry')">愿望</a>
    <a onclick="showPage('puzzle-entry')">拼图</a>
    <a onclick="showPage('voice-entry')">声音</a>
  </nav>
</div>

<!-- 写信选择 -->
<div class="page" id="page-letter-choice">
  <h2>写一封信</h2>
  <p style="color:#888">给现在的人 · 给未来的人</p>
  <button class="btn btn-primary" onclick="showPage('letter-write')">现在寄出</button>
  <button class="btn" onclick="alert('这个功能马上就来')">定时寄出</button>
  <p style="margin-top:20px"><a href="#" onclick="showPage('letter-wall')" style="color:#888">看看别人写的信 → 信墙</a></p>
</div>

<!-- 写信页 -->
<div class="page" id="page-letter-write">
  <div class="letter-paper">
    <input type="text" id="letterTo" placeholder="致 ______">
    <textarea id="letterContent" placeholder="在这里写你想说的话..."></textarea>
    <input type="text" id="letterFrom" placeholder="—— 你的名字（留空显示匿名）">
  </div>
  <div style="margin-top:10px">
    <button class="btn" onclick="saveLetter()">保存草稿</button>
    <button class="btn btn-primary" onclick="sealLetter()">封存这封信</button>
  </div>
</div>

<!-- 封存页 -->
<div class="page" id="page-letter-seal">
  <p>这封信已封存</p>
  <button class="btn" onclick="copyLink()">复制链接</button>
  <button class="btn" onclick="alert('请截图保存')">下载为图片</button>
</div>

<!-- 收信页 -->
<div class="page" id="page-letter-receive">
  <div id="receiveContent">
    <div class="letter-paper" id="receiveLetter"></div>
    <button class="btn btn-primary" onclick="showPage('letter-write')">我也想写一封回去</button>
  </div>
</div>

<!-- 信墙 -->
<div class="page" id="page-letter-wall">
  <h2>信墙</h2>
  <div id="wallCards"></div>
</div>

<!-- 愿望入口 -->
<div class="page" id="page-wish-entry">
  <h2>我们的愿望清单</h2>
  <p style="color:#888">想一起做的事，一件一件来。</p>
  <button class="btn btn-primary" onclick="showPage('wish-list')">创建我们的清单</button>
  <button class="btn" onclick="showPage('wish-inspire')">看看别人的愿望</button>
</div>

<!-- 清单页 -->
<div class="page" id="page-wish-list">
  <h3>我们的愿望清单</h3>
  <div id="wishUndone"></div>
  <div id="wishDone" style="margin-top:20px;opacity:.6"></div>
  <button class="btn" onclick="addWish()">+ 添加新愿望</button>
</div>

<!-- 灵感库 -->
<div class="page" id="page-wish-inspire">
  <h2>灵感库</h2>
  <div id="inspireList"></div>
</div>

<!-- 拼图入口 -->
<div class="page" id="page-puzzle-entry">
  <h2>把我们的照片，拼回去。</h2>
  <p style="color:#888">上传一张你们的合照，把它拆成碎片，再一起拼回来。</p>
  <button class="btn btn-primary" onclick="document.getElementById('puzzleFileInput').click()">上传照片开始</button>
  <input type="file" id="puzzleFileInput" accept="image/*" style="display:none" onchange="startPuzzle(this)">
</div>

<!-- 拼图页 -->
<div class="page" id="page-puzzle">
  <div class="puzzle-board" id="puzzleBoard"></div>
  <div class="piece-pool" id="piecePool"></div>
  <button class="btn" onclick="showPage('puzzle-entry')">换图</button>
</div>

<!-- 拼图完成 -->
<div class="page" id="page-puzzle-complete">
  <p>拼图完成！</p>
  <button class="btn btn-primary" onclick="showPage('letter-write')">写一封信纪念这一刻</button>
</div>

<!-- 声音入口 -->
<div class="page" id="page-voice-entry">
  <h2>声音胶囊</h2>
  <p style="color:#888">有些话，录下来，到那天再打开。</p>
  <button class="btn btn-primary" onclick="showPage('voice-record')">录一颗胶囊</button>
  <button class="btn" onclick="showPage('capsule-wall')">我的胶囊</button>
</div>

<!-- 录音页 -->
<div class="page" id="page-voice-record">
  <p>按住说话，松开结束</p>
  <button class="mic-btn" id="micBtn">🎤</button>
  <div id="recordActions">
    <button class="btn" onclick="playRecord()">试听</button>
    <button class="btn" onclick="reRecord()">重录</button>
    <button class="btn" onclick="sealRecord()">封存到未来</button>
    <input type="date" id="unlockDateInput" onchange="saveCapsule()">
  </div>
</div>

<!-- 胶囊墙 -->
<div class="page" id="page-capsule-wall">
  <h2>胶囊墙</h2>
  <div id="capsuleList"></div>
</div>

<div id="toast"></div>
    <script>
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(function(){t.style.display='none'},3000);
}

// 弹幕墙
var barrages=[
  '在一起第1247天，他还是会在过马路时走在车来的那一侧。',
  '我没敢发出去的那句话是：我还在等你。',
  '异地恋第三年，今天终于可以见面了。',
  '如果重来一次，我还是会选你。',
  '你煮的面真的很难吃，但我每次都吃完了。',
  '今天路过我们第一次见面的地方，我停了三秒。',
  '其实我早就原谅你了，只是不知道怎么说。',
  '你睡着的呼吸声让我觉得很安心。',
  '我想和你一起变老。',
  '七夕快乐，我的爱人。'
];
function initBarrage(){
  var tracks=['track1','track2','track3'];
  tracks.forEach(function(id){document.getElementById(id).innerHTML=''});
  barrages.forEach(function(text,i){
    var track=document.getElementById(tracks[i%3]);
    var el=document.createElement('div');
    el.className='barrage-item';
    el.textContent=text;
    el.style.animationDuration=(5+Math.random()*3)+'s';
    el.style.top=(Math.random()*60)+'%';
    track.appendChild(el);
  });
}
function addBarrage(){
  var text=prompt('写一句你想说的话，匿名漂流。','');
  if(text){
    barrages.push(text);
    initBarrage();
    toast('这句话漂出去了');
  }
}

// 写信
function saveLetter(){
  var draft={to:document.getElementById('letterTo').value,content:document.getElementById('letterContent').value,from:document.getElementById('letterFrom').value};
  localStorage.setItem('letterDraft',JSON.stringify(draft));
  toast('已保存');
}
function sealLetter(){
  var content=document.getElementById('letterContent').value.trim();
  if(!content){toast('信还是空的');return}
  var draft={to:document.getElementById('letterTo').value||'___',content:content,from:document.getElementById('letterFrom').value||'匿名',date:new Date().toLocaleDateString('zh-CN')};
  localStorage.setItem('letterDraft',JSON.stringify(draft));
  showPage('letter-seal');
}
function copyLink(){
  var draft=JSON.parse(localStorage.getItem('letterDraft')||'{}');
  var encoded=encodeURIComponent(JSON.stringify(draft));
  var url=location.href.split('?')[0]+'?letter='+encoded;
  navigator.clipboard.writeText(url).then(function(){toast('链接已复制')});
}

// 信墙
var presetLetters=[
  {from:'小满',content:'今天是我们在一起的第999天。'},
  {from:'匿名',content:'如果那天我没有松开手，现在我们会怎样？'},
  {from:'阿杰',content:'异地恋很苦，但一想到你就甜了。'}
];
function renderWall(){
  var wall=document.getElementById('wallCards');
  wall.innerHTML='';
  var letters=JSON.parse(localStorage.getItem('publicLetters')||'[]');
  var all=presetLetters.concat(letters);
  all.forEach(function(l){
    var card=document.createElement('div');
    card.style.cssText='background:rgba(255,255,255,.05);padding:10px;margin:8px;border-radius:4px;cursor:pointer';
    card.textContent=l.content+' —— '+(l.from||'匿名');
    card.onclick=function(){this.style.whiteSpace='normal'};
    wall.appendChild(card);
  });
}
document.addEventListener('DOMContentLoaded',function(){
  renderWall();
});

// 愿望清单
var presetWishes=[
  '一起在凌晨两点去吃海底捞',
  '一起养一盆植物',
  '一起坐一次绿皮火车',
  '在大雨里不打伞走一次',
  '一起在海边等日出'
];
function getWishes(){
  var wishes=JSON.parse(localStorage.getItem('wishes')||'null');
  if(!wishes){wishes=presetWishes.slice();localStorage.setItem('wishes',JSON.stringify(wishes))}
  return wishes;
}
function renderWishList(){
  var undone=document.getElementById('wishUndone');
  var done=document.getElementById('wishDone');
  undone.innerHTML='';done.innerHTML='';
  var wishes=getWishes();
  wishes.forEach(function(w){
    var item=document.createElement('div');
    item.className='wish-item';
    item.textContent=w;
    item.onclick=function(){
      var wishes=getWishes();
      var index=wishes.indexOf(w);
      if(index>-1){wishes.splice(index,1);localStorage.setItem('wishes',JSON.stringify(wishes));renderWishList()}
    };
    undone.appendChild(item);
  });
}
function addWish(){
  var text=prompt('写下想一起做的事：','');
  if(text){
    var wishes=getWishes();
    wishes.push(text);
    localStorage.setItem('wishes',JSON.stringify(wishes));
    renderWishList();
  }
}
function renderInspire(){
  var list=document.getElementById('inspireList');
  list.innerHTML='';
  presetWishes.forEach(function(w){
    var item=document.createElement('div');
    item.className='wish-item';
    item.textContent=w+' （点击加入）';
    item.onclick=function(){
      var wishes=getWishes();
      wishes.push(w);
      localStorage.setItem('wishes',JSON.stringify(wishes));
      toast('已加入清单');
    };
    list.appendChild(item);
  });
}
document.addEventListener('DOMContentLoaded',function(){
  renderWishList();
  renderInspire();
});
// 拼图
function startPuzzle(input){
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      showPage('puzzle');
      var board=document.getElementById('puzzleBoard');
      var pool=document.getElementById('piecePool');
      board.innerHTML='';pool.innerHTML='';
      for(var i=0;i<9;i++){
        var slot=document.createElement('div');
        slot.className='puzzle-slot';
        slot.dataset.index=i;
        board.appendChild(slot);
      }
      for(var j=0;j<9;j++){
        var piece=document.createElement('img');
        piece.src=e.target.result;
        piece.style.width='100px';piece.style.height='100px';
        piece.style.objectFit='cover';
        piece.style.objectPosition=(-(j%3)*100)+'px '+(-(Math.floor(j/3))*100)+'px';
        piece.draggable=true;
        piece.dataset.index=j;
        piece.ondragstart=function(ev){ev.dataTransfer.setData('index',this.dataset.index)};
        pool.appendChild(piece);
      }
      document.querySelectorAll('.puzzle-slot').forEach(function(slot){
        slot.ondragover=function(e){e.preventDefault()};
        slot.ondrop=function(e){
          e.preventDefault();
          var idx=e.dataTransfer.getData('index');
          if(idx==this.dataset.index){
            this.innerHTML='';
            var img=document.createElement('img');
            img.src=e.target.result;
            img.style.width='100%';img.style.height='100%';img.style.objectFit='cover';
            this.appendChild(img);
            toast('正确');
          }else{toast('不对哦')}
        };
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// 声音
var mediaRecorder,recordedChunks=[],recordedBlob=null;
document.getElementById('micBtn').onpointerdown=function(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaRecorder=new MediaRecorder(stream);
    recordedChunks=[];
    mediaRecorder.ondataavailable=function(e){recordedChunks.push(e.data)};
    mediaRecorder.onstop=function(){
      recordedBlob=new Blob(recordedChunks,{type:'audio/webm'});
      document.getElementById('recordActions').style.display='block';
    };
    mediaRecorder.start();
  });
};
document.getElementById('micBtn').onpointerup=function(){
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
};
function playRecord(){
  if(recordedBlob){var audio=new Audio(URL.createObjectURL(recordedBlob));audio.play()}
}
function reRecord(){
  recordedBlob=null;document.getElementById('recordActions').style.display='none';
}
function sealRecord(){
  document.getElementById('unlockDateInput').style.display='block';
}
function saveCapsule(){
  var date=document.getElementById('unlockDateInput').value;
  if(date&&recordedBlob){
    var capsules=JSON.parse(localStorage.getItem('capsules')||'[]');
    capsules.push({unlockDate:date,blobUrl:URL.createObjectURL(recordedBlob)});
    localStorage.setItem('capsules',JSON.stringify(capsules));
    toast('胶囊已封存');
    showPage('capsule-wall');
  }
}
function renderCapsules(){
  var list=document.getElementById('capsuleList');
  list.innerHTML='';
  var capsules=JSON.parse(localStorage.getItem('capsules')||'[]');
  capsules.forEach(function(c){
    var item=document.createElement('div');
    item.className='wish-item';
    item.textContent='封存至 '+c.unlockDate;
    item.onclick=function(){new Audio(c.blobUrl).play()};
    list.appendChild(item);
  });
}
document.addEventListener('DOMContentLoaded',function(){
  renderCapsules();
});
</script>
</body>
</html>
